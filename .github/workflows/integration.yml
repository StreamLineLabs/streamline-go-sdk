name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 4am UTC
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      # Repository administrators must configure this Actions variable as an
      # immutable repository@sha256 digest. There is deliberately no mutable
      # tag fallback.
      STREAMLINE_INTEGRATION_IMAGE: ${{ vars.STREAMLINE_INTEGRATION_IMAGE }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate and pull immutable integration image
        shell: bash
        run: |
          set -euo pipefail
          SERVER_IMAGE_DIGEST="$STREAMLINE_INTEGRATION_IMAGE" \
            scripts/release/verify-server-image.sh
      - name: Start digest-pinned Streamline fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name streamline-integration-fixture \
            -p 9092:9092 \
            -p 9094:9094 \
            "$STREAMLINE_INTEGRATION_IMAGE"
      - name: Wait for Streamline
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9094/health; then
              exit 0
            fi
            echo "Waiting for Streamline... ($i/30)"
            sleep 2
          done
          echo "Streamline failed to become healthy"
          exit 1
      - name: Run integration tests
        run: go test -v -count=1 -tags=integration -timeout 120s ./...
        env:
          STREAMLINE_BOOTSTRAP: localhost:9092
          STREAMLINE_HTTP: http://localhost:9094
          STREAMLINE_REQUIRE_INTEGRATION: "true"
      - name: Stop Streamline fixture
        if: always()
        run: docker rm -f streamline-integration-fixture || true
