name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - name: Verify examples compile
        run: go build ./examples/...
      - name: Run unit tests
        run: go test -short ./...

      - name: Verify build tag variants
        run: |
          go vet -tags integration ./...
          # Native embedded mode requires an external libstreamline install.
          # This verifies the explicitly supported CGO-disabled fallback.
          CGO_ENABLED=0 go build -tags embedded ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

      - name: Set up patched Go for Testcontainers module
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: testcontainers/go.sum

      - name: Verify Testcontainers module
        run: |
          cd testcontainers
          go mod verify
          go build ./...
          go vet ./...
          go test ./...

  vulnerability-scan:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "."
            go-version: "1.25.14"
            cache-file: go.sum
          - module: testcontainers
            go-version: "1.26.6"
            cache-file: testcontainers/go.sum
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ${{ matrix.cache-file }}

      - name: Run pinned govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  conformance:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Start Streamline server
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9094/health > /dev/null 2>&1; then
              echo "Streamline is healthy"
              exit 0
            fi
            echo "Waiting for Streamline... ($i/30)"
            sleep 2
          done
          echo "Streamline failed to start"
          docker compose -f docker-compose.test.yml logs
          exit 1

      - name: Run conformance tests
        run: go test -v -tags=integration -run 'Test[PCGADSEF]' -timeout 120s ./...
        env:
          STREAMLINE_BOOTSTRAP: localhost:9092
          STREAMLINE_HTTP: http://localhost:9094
          STREAMLINE_REQUIRE_INTEGRATION: "true"

      - name: Stop Streamline server
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
